<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大阪市神社検索（試作版）</title>
<style>
:root{--paper:#f7f4ec;--ink:#1d1b16;--muted:#6b655a;--rule:#c9c3b3;--red:#a1281f;--blue:#2d5d7b;--green:#2f6b3f}
*{box-sizing:border-box}
body{margin:0;background:#e9e5d8;color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;line-height:1.7}
.sheet{max-width:1080px;margin:0 auto;background:var(--paper);padding:20px 28px 40px;min-height:100vh}
.masthead{text-align:center;border-top:4px double var(--ink);border-bottom:1px solid var(--ink);padding:6px 0 10px}
.masthead .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:4px}
.masthead h1{margin:8px 0 0;font-size:2.6rem;letter-spacing:.12em;font-weight:700}
.masthead .sub{margin:0;font-size:.9rem;color:var(--muted);letter-spacing:.2em}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:.9rem;padding:3px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--paper)}
.controls label{font-size:.9rem}
.controls select,.controls input{font:inherit;font-size:.9rem;padding:4px 8px;border:1px solid var(--ink);background:#fff;color:var(--ink)}
.controls input{flex:1;min-width:180px}
#count{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.ward{margin-top:22px}
.ward h2{margin:0 0 10px;font-size:1.35rem;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:3px 0;display:flex;justify-content:space-between;align-items:baseline}
.ward h2 span{font-size:.8rem;font-weight:400;color:var(--muted)}
.cards{column-width:300px;column-gap:32px;column-rule:1px solid var(--rule)}
.card{display:inline-block;width:100%;break-inside:avoid;padding:8px 0 12px;border-bottom:1px solid var(--rule);margin:0 0 6px;transition:background .4s}
.card.flash{background:#fff3c4}
.card h3{margin:0 0 4px;font-size:1.25rem;font-weight:700;line-height:1.4}
.tags{margin-bottom:4px}
.tag{display:inline-block;font-family:"Hiragino Sans","Yu Gothic",sans-serif;font-size:.72rem;border:1px solid;padding:0 6px;margin:0 6px 4px 0;line-height:1.6}
.tag a{color:inherit}
.tag.shiki{color:var(--red)}
.tag.matsu{color:var(--blue)}
.tag.gyogu{color:var(--green)}
.card dl{display:grid;grid-template-columns:4.2em 1fr;gap:1px 8px;margin:4px 0;font-size:.9rem}
.card dt{color:var(--muted)}
.card dd{margin:0}
.desc{margin:6px 0 0;font-size:.92rem}
.rels{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.rels a{color:var(--ink)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin-top:30px;padding-top:10px;border-top:1px solid var(--ink);font-size:.8rem;color:var(--muted)}
@media(max-width:600px){.sheet{padding:14px 14px 30px}.masthead h1{font-size:2rem}}
</style>
</head>
<body>
<div class="sheet">
<header class="masthead">
<div class="meta"><span id="today"></span><span>試作版</span></div>
<h1>大阪市神社検索</h1>
</header>
<section class="controls">
<div class="chips" id="chips">
<button type="button" data-f="all" class="on">すべて</button>
<button type="button" data-f="shiki">式内社</button>
<button type="button" data-f="matsu">末社</button>
<button type="button" data-f="gyogu">行宮</button>
</div>
<label>区 <select id="ward"></select></label>
<input id="q" type="search" placeholder="神社名、祭神、住所で探す">
</section>
<p id="count"></p>
<main id="paper"></main>
<footer>住所は大阪府神社庁などの公開情報をもとにしています。創建や主祭神は調査中のため、空欄の項目があります。</footer>
</div>
<script src="osaka-data.js"></script>
<script>
(function(){
var paper=document.getElementById("paper");
var count=document.getElementById("count");
var d0=new Date();
document.getElementById("today").textContent=d0.getFullYear()+"年"+(d0.getMonth()+1)+"月"+d0.getDate()+"日";
if(typeof SHRINES==="undefined"){
paper.innerHTML='<p class="empty">データのファイル（osaka-data.js）が見つかりません。osaka.html と同じ場所に置いてください。</p>';
return;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function wardOf(a){var m=/大阪市(.+?区)/.exec(a||"");if(m)return m[1];m=/(堺市.+?区)/.exec(a||"");return m?m[1]:"その他";}
var items=SHRINES.map(function(d,i){
var r=d.r||"";
return {id:i+1,n:d.n,a:d.a||"",ward:wardOf(d.a),s:d.s||"",r:r,d:d.d||"",c:d.c||"",m:d.m||"",
isShiki:!!d.s,isMatsu:r.indexOf("末社")>=0,isGyogu:r.indexOf("行宮")>=0,parent:null,kids:[]};
});
var byName={};
items.forEach(function(it){if(!(it.n in byName))byName[it.n]=it;});
var names=Object.keys(byName).sort(function(a,b){return b.length-a.length;});
items.forEach(function(it){
if(!it.r)return;
for(var i=0;i<names.length;i++){
var p=byName[names[i]];
if(p!==it&&it.r.indexOf(names[i])===0){it.parent=p;p.kids.push(it);break;}
}
});
var wards=[];
items.forEach(function(it){if(wards.indexOf(it.ward)<0)wards.push(it.ward);});
var order=wards.filter(function(w){return w.indexOf("堺市")!==0&&w!=="その他";}).concat(wards.filter(function(w){return w.indexOf("堺市")===0||w==="その他";}));
var sel=document.getElementById("ward");
sel.innerHTML='<option value="all">すべての区</option>'+order.map(function(w){return '<option value="'+esc(w)+'">'+esc(w)+'</option>';}).join("");
var state={f:"all",w:"all",q:""};
function match(it){
if(state.f==="shiki"&&!it.isShiki)return false;
if(state.f==="matsu"&&!it.isMatsu)return false;
if(state.f==="gyogu"&&!it.isGyogu)return false;
if(state.w!=="all"&&it.ward!==state.w)return false;
if(state.q){
var hay=[it.n,it.a,it.s,it.r,it.c,it.m,it.d].join(" ").toLowerCase();
if(hay.indexOf(state.q)<0)return false;
}
return true;
}
function card(it){
var t="";
if(it.s)t+='<span class="tag shiki">'+esc(it.s)+'</span>';
if(it.r){
var rt=esc(it.r);
if(it.parent){var pn=esc(it.parent.n);rt='<a href="#s'+it.parent.id+'">'+pn+'</a>'+rt.slice(pn.length);}
t+='<span class="tag '+(it.isGyogu?"gyogu":"matsu")+'">'+rt+'</span>';
}
var dl="";
if(it.a)dl+='<dt>住所</dt><dd>'+esc(it.a)+'</dd>';
if(it.c)dl+='<dt>創建</dt><dd>'+esc(it.c)+'</dd>';
if(it.m)dl+='<dt>主祭神</dt><dd>'+esc(it.m)+'</dd>';
var h='<article class="card" id="s'+it.id+'"><h3>'+esc(it.n)+'</h3>';
if(t)h+='<div class="tags">'+t+'</div>';
if(dl)h+='<dl>'+dl+'</dl>';
if(it.d)h+='<p class="desc">'+esc(it.d).replace(/\n/g,"<br>")+'</p>';
if(it.kids.length){
h+='<p class="rels">関連：'+it.kids.map(function(k){
return '<a href="#s'+k.id+'">'+esc(k.n)+'</a>（'+(k.isGyogu?"行宮":"末社")+'）';
}).join("、")+'</p>';
}
return h+'</article>';
}
function render(){
var html="",shown=0;
order.forEach(function(w){
var list=items.filter(function(it){return it.ward===w&&match(it);});
if(!list.length)return;
shown+=list.length;
html+='<section class="ward"><h2>'+esc(w)+'<span>'+list.length+'件</span></h2><div class="cards">'+list.map(card).join("")+'</div></section>';
});
paper.innerHTML=html||'<p class="empty">該当する神社がありません。条件を変えてみてください。</p>';
count.textContent=shown+"件を表示（全"+items.length+"件）";
}
var btns=document.querySelectorAll("#chips button");
function setChip(f){
state.f=f;
for(var i=0;i<btns.length;i++){btns[i].className=btns[i].getAttribute("data-f")===f?"on":"";}
}
for(var i=0;i<btns.length;i++){
btns[i].addEventListener("click",function(){setChip(this.getAttribute("data-f"));render();});
}
sel.addEventListener("change",function(){state.w=sel.value;render();});
var qi=document.getElementById("q");
qi.addEventListener("input",function(){state.q=qi.value.trim().toLowerCase();render();});
document.addEventListener("click",function(e){
var a=e.target.closest?e.target.closest('a[href^="#s"]'):null;
if(!a)return;
e.preventDefault();
setChip("all");state.w="all";sel.value="all";state.q="";qi.value="";
render();
var el=document.getElementById(a.getAttribute("href").slice(1));
if(el){
el.scrollIntoView({behavior:"smooth",block:"center"});
el.classList.add("flash");
setTimeout(function(){el.classList.remove("flash");},1600);
}
});
render();
})();
</script>
</body>
</html>
